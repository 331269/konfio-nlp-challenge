[project]
name = "konfio"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "feature-engine>=1.9.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "scikit-multilearn>=0.2.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.2.0",
    "shap>=0.54.1",
    "tensorflow>=2.21.0",
    "torch>=2.11.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
